repos:
  - repo: local
    hooks:
      - id: block-page-pause
        name: Prevent page.pause() in commits
        entry: bash -c 'grep -E "page\.pause\(" "$@" && echo "❌ page.pause() found!" && exit 1 || exit 0'
        pass_filenames: true
        language: system
        types: [python]
        files: '\.py$'
